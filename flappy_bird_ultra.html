<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Ultra - Day & Night Cycle</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #111;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            border: 6px solid #333;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            image-rendering: pixelated;
        }
        #ui {
            position: absolute;
            text-align: center;
            color: white;
            text-shadow: 4px 4px 0px #000;
            pointer-events: none;
            width: 360px;
            z-index: 10;
        }
        .score {
            font-size: 64px;
            margin-top: 40px;
        }
        .message {
            font-size: 24px;
            margin-top: 150px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="scoreDisplay" class="score">0</div>
        <div id="messageDisplay" class="message">TAP TO START</div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const messageDisplay = document.getElementById('messageDisplay');

        canvas.width = 360;
        canvas.height = 640;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(500, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start();
                osc.stop(now + 0.1);
            } else if (type === 'score') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start();
                osc.stop(now + 0.2);
            } else if (type === 'die') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.4);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.start();
                osc.stop(now + 0.4);
            }
        }

        const GRAVITY = 0.18;
        const JUMP = -4.8;
        const PIPE_SPEED = 2.5;
        const PIPE_SPAWN_RATE = 90;
        const PIPE_GAP = 180;
        const PIPE_WIDTH = 70;

        let bird = { x: 50, y: 300, velocity: 0, width: 38, height: 28, rotation: 0 };
        let pipes = [];
        let clouds = [];
        let stars = [];
        let frameCount = 0;
        let score = 0;
        let gameActive = false;
        let gameOver = false;
        let timeOfDay = 0;

        function resetGame() {
            bird = { x: 50, y: 300, velocity: 0, width: 38, height: 28, rotation: 0 };
            pipes = [];
            clouds = Array.from({length: 6}, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * 250,
                speed: 0.2 + Math.random() * 0.4,
                w: 50 + Math.random() * 50,
                h: 20 + Math.random() * 20
            }));
            stars = Array.from({length: 50}, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                opacity: Math.random()
            }));
            frameCount = 0;
            score = 0;
            scoreDisplay.innerText = '0';
            messageDisplay.style.display = 'none';
            gameActive = true;
            gameOver = false;
            timeOfDay = 0;
        }

        function createPipe() {
            const minPipeHeight = 80;
            const maxPipeHeight = canvas.height - PIPE_GAP - minPipeHeight - 100;
            const height = Math.floor(Math.random() * (maxPipeHeight - minPipeHeight + 1)) + minPipeHeight;
            pipes.push({
                x: canvas.width,
                topHeight: height,
                passed: false
            });
        }

        function drawBird() {
            ctx.save();
            ctx.translate(bird.x + bird.width / 2, bird.y + bird.height / 2);
            bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.velocity * 0.1));
            ctx.rotate(bird.rotation);
            
            // Body
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(-bird.width / 2, -bird.height / 2, bird.width, bird.height);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.strokeRect(-bird.width / 2, -bird.height / 2, bird.width, bird.height);
            
            // Eye
            ctx.fillStyle = '#FFF';
            ctx.fillRect(5, -10, 10, 10);
            ctx.fillStyle = '#000';
            ctx.fillRect(10, -7, 5, 5);
            
            // Beak
            ctx.fillStyle = '#FF4500';
            ctx.fillRect(bird.width / 2 - 5, -2, 10, 8);
            
            ctx.restore();
        }

        function drawPipes() {
            pipes.forEach(pipe => {
                ctx.fillStyle = '#2ecc71';
                ctx.strokeStyle = '#27ae60';
                ctx.lineWidth = 4;

                // Top pipe
                ctx.fillRect(pipe.x, 0, PIPE_WIDTH, pipe.topHeight);
                ctx.strokeRect(pipe.x, 0, PIPE_WIDTH, pipe.topHeight);

                // Bottom pipe
                const bottomY = pipe.topHeight + PIPE_GAP;
                const bottomHeight = canvas.height - bottomY;
                ctx.fillRect(pipe.x, bottomY, PIPE_WIDTH, bottomHeight);
                ctx.strokeRect(pipe.x, bottomY, PIPE_WIDTH, bottomHeight);
            });
        }

        function update() {
            if (!gameActive || gameOver) return;

            bird.velocity += GRAVITY;
            bird.y += bird.velocity;

            if (frameCount % PIPE_SPAWN_RATE === 0) {
                createPipe();
            }

            pipes.forEach((pipe, index) => {
                pipe.x -= PIPE_SPEED;

                // Collision detection
                if (
                    bird.x + bird.width > pipe.x &&
                    bird.x < pipe.x + PIPE_WIDTH &&
                    (bird.y < pipe.topHeight || bird.y + bird.height > pipe.topHeight + PIPE_GAP)
                ) {
                    endGame();
                }

                // Score
                if (!pipe.passed && pipe.x + PIPE_WIDTH < bird.x) {
                    score++;
                    scoreDisplay.innerText = score;
                    pipe.passed = true;
                    playSound('score');
                }

                // Remove off-screen pipes
                if (pipe.x + PIPE_WIDTH < 0) {
                    pipes.splice(index, 1);
                }
            });

            // Floor/Ceiling collision
            if (bird.y + bird.height > canvas.height || bird.y < 0) {
                endGame();
            }

            frameCount++;
            timeOfDay += 0.001;
        }

        function endGame() {
            gameOver = true;
            gameActive = false;
            playSound('die');
            messageDisplay.innerText = 'GAME OVER - TAP TO RESTART';
            messageDisplay.style.display = 'inline-block';
        }

        function draw() {
            // Background color based on time of day
            const skyColor = Math.sin(timeOfDay) > 0 ? '#87CEEB' : '#2c3e50';
            ctx.fillStyle = skyColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw stars if night
            if (Math.sin(timeOfDay) <= 0) {
                ctx.fillStyle = '#FFF';
                stars.forEach(star => {
                    ctx.globalAlpha = star.opacity;
                    ctx.fillRect(star.x, star.y, star.size, star.size);
                });
                ctx.globalAlpha = 1.0;
            }

            // Draw clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            clouds.forEach(cloud => {
                cloud.x -= cloud.speed;
                if (cloud.x + cloud.w < 0) cloud.x = canvas.width;
                ctx.fillRect(cloud.x, cloud.y, cloud.w, cloud.h);
            });

            drawPipes();
            drawBird();

            requestAnimationFrame(() => {
                update();
                draw();
            });
        }

        function handleInput() {
            if (!gameActive && !gameOver) {
                resetGame();
            } else if (gameOver) {
                resetGame();
            } else {
                bird.velocity = JUMP;
                playSound('jump');
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') handleInput();
        });
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput();
        });
        canvas.addEventListener('mousedown', handleInput);

        resetGame();
        gameActive = false; // Start paused
        draw();
    </script>
</body>
</html>
